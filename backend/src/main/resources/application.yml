# 기본 프로필(local): H2 파일 DB(MySQL 호환 모드) — MySQL·Docker 없이 바로 실행
# MySQL(Docker)로 실행: --spring.profiles.active=mysql  (IntelliJ 실행 목록의 "backend bootRun (Docker MySQL)")
spring:
  application:
    name: qr-checkin
  config:
    # 프로젝트 루트의 .env(docker compose 와 같은 파일)가 있으면 비밀번호·비밀키를 읽는다. 없으면 무시
    import: "optional:file:../.env[.properties]"
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      # 출석 인정 증빙 파일(5MB) + 여유
      max-file-size: 5MB
      max-request-size: 6MB
  web:
    resources:
      cache:
        cachecontrol:
          # index.html 등은 매번 바뀌었는지 확인(안 바뀌었으면 304). /assets 는 WebCacheConfig 에서 1년 캐시
          no-cache: true

server:
  port: 8080
  # 화면(JS·CSS)·API 응답을 gzip 으로 압축해서 보낸다(JS 약 340KB → 100KB 안팎)
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml,application/manifest+json
    min-response-size: 1024
  # cloudflared·Nginx 같은 프록시 뒤에서 원래 주소(https://...)를 알 수 있게 X-Forwarded-* 헤더를 신뢰
  forward-headers-strategy: framework

app:
  timezone: Asia/Seoul
  jwt:
    # 32바이트 이상. 운영에서는 반드시 환경 변수 JWT_SECRET 로 교체
    secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-0123456789abcdef}
    expiration-hours: 24
  qr:
    # QR 서명 비밀키 — 저장소에 올리지 말고 환경 변수 QR_SECRET 로 관리
    secret: ${QR_SECRET:local-dev-qr-secret-change-me-0123456789abcdef}
    refresh-seconds: 15
    allowed-past-windows: 1
  checkin:
    default-minutes: 5
    max-accuracy-m: 100
    close-check-ms: 60000
  # QR 에 담기는 출석 URL 의 앞부분(GET /qr 응답의 url). 화면은 지금 접속한 주소로 QR 을 직접 만든다
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  cors:
    # 다른 주소에서 API 를 부를 때 허용할 출처(패턴). 화면과 API 가 같은 주소면 필요 없음
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,https://*.trycloudflare.com}
  attendance:
    # 결석(인정 결석)이 전체 회차의 이 비율을 넘으면 F 기준 — 경고 알림·AI 도우미에 쓴다
    # 학교 규칙: 수업일수의 2/3 이상 출석해야 함 → 결석 1/3 초과면 F
    fail-ratio: 0.3333333333
    warning-check-ms: 120000
  push:
    # 수업 몇 분 전에 알릴지, 몇 ms 마다 확인할지
    lead-minutes: 10
    check-ms: 60000
    # 푸시 서버(구글·애플)에 알려 주는 연락처. VAPID 키는 처음 실행 때 자동으로 만들어 DB에 저장한다
    subject: ${PUSH_SUBJECT:mailto:qr-checkin@example.com}
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
  assistant:
    # AI 출결 도우미(학생용). OpenAI 호환 /chat/completions 를 쓰는 무료 등급 LLM — 루트 .env 의 LLM_* 를 읽는다
    #   Gemini: https://generativelanguage.googleapis.com/v1beta/openai   Groq: https://api.groq.com/openai/v1
    # 셋 중 하나라도 비어 있으면 도우미는 '사용할 수 없음'(추천 질문은 서버 템플릿 답변으로만)
    base-url: ${LLM_BASE_URL:}
    model: ${LLM_MODEL:}
    api-key: ${LLM_API_KEY:}
    timeout-seconds: 25
    # Gemini 가 답하기 전에 생각하는 양(low·medium·high). low 가 가장 빠르다. 비우면 모델 기본값
    reasoning-effort: low
    # 추천 질문 버튼은 LLM 을 거치지 않고 서버가 바로 답한다(빠르고 숫자가 정확). false 면 추천 질문도 AI 가 답함
    preset-direct: true
    # 질문 하나에서 도구를 부를 수 있는 최대 횟수
    max-tool-calls: 6
    # 학생 한 명당 호출 제한(무료 한도를 넘지 않게)
    per-minute-limit: 6
    daily-limit: 40
    # 서버가 켜질 때 짧은 요청으로 키·모델이 맞는지 로그에 알려 줌
    startup-check: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 새로고침·서버 재시작 후에도 [Authorize]에 넣은 토큰 유지(브라우저 localStorage)
    persist-authorization: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/qrcheckin;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    # 기본값은 Docker 의 db 컨테이너(localhost:3307). docker compose 의 app 은 DB_URL 로 db:3306 을 넘긴다
    url: ${DB_URL:jdbc:mysql://localhost:3307/qrcheckin?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:qrcheckin}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
