# 기본 프로필(local): H2 파일 DB(MySQL 호환 모드) — MySQL 설치 없이 바로 실행
# MySQL로 실행: --spring.profiles.active=mysql
spring:
  application:
    name: qr-checkin
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Seoul
  web:
    resources:
      cache:
        cachecontrol:
          # 화면 파일 이름이 고정이라, 브라우저가 매번 바뀌었는지 확인하게 한다(안 바뀌었으면 304)
          no-cache: true

server:
  port: 8080
  # cloudflared·Nginx 같은 프록시 뒤에서 원래 주소(https://...)를 알 수 있게 X-Forwarded-* 헤더를 신뢰
  forward-headers-strategy: framework

app:
  timezone: Asia/Seoul
  jwt:
    # 32바이트 이상. 운영에서는 반드시 환경 변수 JWT_SECRET 로 교체
    secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-0123456789abcdef}
    expiration-hours: 24
  qr:
    # QR 서명 비밀키 — 저장소에 올리지 말고 환경 변수 QR_SECRET 로 관리
    secret: ${QR_SECRET:local-dev-qr-secret-change-me-0123456789abcdef}
    refresh-seconds: 15
    allowed-past-windows: 1
  checkin:
    default-minutes: 5
    max-accuracy-m: 100
    close-check-ms: 60000
  # QR 에 담기는 출석 URL 의 앞부분(GET /qr 응답의 url). 화면은 지금 접속한 주소로 QR 을 직접 만든다
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  cors:
    # 다른 주소에서 API 를 부를 때 허용할 출처(패턴). 화면과 API 가 같은 주소면 필요 없음
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,https://*.trycloudflare.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 새로고침·서버 재시작 후에도 [Authorize]에 넣은 토큰 유지(브라우저 localStorage)
    persist-authorization: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/qrcheckin;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/qrcheckin?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USER:qrcheckin}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
